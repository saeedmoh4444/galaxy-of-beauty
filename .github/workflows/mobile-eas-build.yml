name: Mobile — EAS Build (App Store)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        required: true
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: 'EAS build profile'
        required: false
        type: choice
        default: 'preview'
        options:
          - preview
          - production
  push:
    branches: [master]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'packages/api/**'
      - 'packages/ui/**'

concurrency:
  group: mobile-eas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Verify mobile integrity before building ──
  verify:
    name: Verify (type-check + export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: {}
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @galaxy/mobile type-check
      # Catch SDK/package drift (KNOWN_ISSUES #8): react-native pinned to a
      # version the installed Expo SDK rejects makes hermesc crash here —
      # this step turns that class of regression into a CI failure.
      - name: Verify expo export (hermesc bundle)
        working-directory: apps/mobile
        run: npx expo export --platform android

  # ── EAS Build (iOS) ──
  build-ios:
    name: EAS Build — iOS
    needs: verify
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios'
    runs-on: ubuntu-latest
    env:
      HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: {}
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Setup Expo
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS Build iOS
        if: env.HAS_EXPO_TOKEN == 'true'
        working-directory: apps/mobile
        run: eas build --platform ios --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive --wait
      - name: Skip build (EXPO_TOKEN not configured)
        if: env.HAS_EXPO_TOKEN != 'true'
        run: echo "::notice::Skipping EAS iOS build — EXPO_TOKEN secret is not configured in this repo"

  # ── EAS Build (Android) ──
  build-android:
    name: EAS Build — Android
    needs: verify
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest
    env:
      HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: {}
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Setup Expo
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS Build Android
        if: env.HAS_EXPO_TOKEN == 'true'
        working-directory: apps/mobile
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive --wait
      - name: Skip build (EXPO_TOKEN not configured)
        if: env.HAS_EXPO_TOKEN != 'true'
        run: echo "::notice::Skipping EAS Android build — EXPO_TOKEN secret is not configured in this repo"

  # ── EAS Update (OTA) ──
  update-ota:
    name: EAS Update (OTA)
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      # Secrets can't be referenced in step `if:` directly — proxy through an env var.
      HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: {}
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Setup Expo
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish OTA Update
        if: env.HAS_EXPO_TOKEN == 'true'
        working-directory: apps/mobile
        env:
          # Pass via env, never inline into the shell command: commit messages
          # contain backticks/newlines that break `run:` interpolation.
          OTA_MESSAGE: ${{ github.event.head_commit.message || 'OTA update from CI' }}
        run: eas update --branch production --message "$OTA_MESSAGE"
      - name: Skip OTA (EXPO_TOKEN not configured)
        if: env.HAS_EXPO_TOKEN != 'true'
        run: echo "::notice::Skipping EAS OTA publish — EXPO_TOKEN secret is not configured in this repo"
