name: CI — Galaxy of Beauty

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── Format Check ──────────────────────────────────────────
  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  # ── Dependency Audit ──────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    # Blocking: fails only when high/critical findings EXCEED the baseline
    # accepted in SECURITY.md (7 high). New findings block the PR.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/audit-check.mjs
      - run: node scripts/check-image-urls.mjs
      # E2 — mobile app-size trim: shipped assets stay under budget
      - run: node scripts/check-mobile-assets.mjs
      # F2 — the tRPC contract must stay generatable (the generator exits
      # non-zero if the router tree or a zod schema breaks). Local lint:
      # `postman spec lint postman/openapi.json`.
      - run: pnpm --filter @galaxy/api exec tsx ../../scripts/gen-openapi.mjs

  # ── Architecture Gates (ARCH-003 + circular deps) ──────────
  cycles:
    name: Architecture Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-cycles.mjs
      - run: node scripts/gen-dependency-graph.mjs --check

  # ── Type Check ────────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Start Turbo remote cache
        uses: rharkor/caching-for-turbo@v2.5.2
      - run: pnpm --filter @galaxy/db exec prisma generate
      - run: pnpm type-check

  # ── Lint ──────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Start Turbo remote cache
        uses: rharkor/caching-for-turbo@v2.5.2
      - run: pnpm lint

  # ── Unit Tests ─────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gob_admin
          POSTGRES_PASSWORD: gob_test_pass
          POSTGRES_DB: Galaxy_of_Beauty_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Start Turbo remote cache
        uses: rharkor/caching-for-turbo@v2.5.2
      - run: pnpm --filter @galaxy/db exec prisma generate
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'
      - name: Migrate Schema (CI)
        run: pnpm --filter @galaxy/db exec prisma migrate deploy
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'
      - name: Seed Test Data
        run: pnpm --filter @galaxy/db db:seed
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'
      # --coverage enforces the vitest.config thresholds (audit F1 — the
      # ratchet was declared but never wired; CI ran vitest without it)
      - run: pnpm --filter @galaxy/api test -- --coverage
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'
      # Mobile pure-logic unit tests (node env — no react-native imports)
      - run: pnpm --filter @galaxy/mobile test:unit
      # Shared/config/ui/db unit tests (audit stage 10 — previously zero)
      - run: pnpm --filter @galaxy/shared test:unit
      - run: pnpm --filter @galaxy/config test:unit
      - run: pnpm --filter @galaxy/ui test
      - run: pnpm --filter @galaxy/db test

  # ── Build ─────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [type-check, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Start Turbo remote cache
        uses: rharkor/caching-for-turbo@v2.5.2
      # C2: the root layout no longer force-dynamics every route, so Next
      # prerenders pages at build and page modules may touch the API env
      # schema. CI build secrets are placeholders — they only satisfy
      # validation, nothing connects at build time.
      - run: pnpm turbo run build
        env:
          DATABASE_URL: 'postgresql://ci_build:ci_build_pass@localhost:5432/ci_build_db?schema=public'
          JWT_ACCESS_SECRET: 'ci-build-access-key-0123456789abcdef-not-for-prod'
          JWT_REFRESH_SECRET: 'ci-build-refresh-key-fedcba9876543210-not-for-prod'
      - run: node scripts/check-size-budgets.mjs

  # ── E2E Tests ─────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    # 2026-10-22: the suite outgrew 35min (315 tests × 3 browser projects
    # ≈ 40min) and the job was being killed mid-pass. 60 no longer buys
    # headroom (the suite passed 440 tests + the consent-banner epoch);
    # 90 buys it; per-project sharding is the follow-up.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gob_admin
          POSTGRES_PASSWORD: gob_test_pass
          POSTGRES_DB: Galaxy_of_Beauty_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Start Turbo remote cache
        uses: rharkor/caching-for-turbo@v2.5.2

      - name: Generate Prisma Client
        run: pnpm --filter @galaxy/db exec prisma generate
      - name: Migrate Schema (CI)
        run: pnpm --filter @galaxy/db exec prisma migrate deploy
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'
      - name: Seed Test Data
        run: pnpm --filter @galaxy/db db:seed
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Browsers
        run: pnpm --filter @galaxy/web exec playwright install --with-deps chromium firefox

      - name: Build Web App
        run: pnpm turbo run build --filter=@galaxy/web
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'
          JWT_ACCESS_SECRET: 'e2e-access-9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c'
          JWT_REFRESH_SECRET: 'e2e-refresh-1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d'

      - name: Start Next.js Server
        run: |
          pnpm --filter @galaxy/web exec next start --port 3000 &
          SERVER_PID=$!
          # Wait for the server to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/trpc/health; then break; fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then echo "Server exited early"; exit 1; fi
            sleep 1
          done
          # Warm the dynamic routes the suite interacts with first.
          # `next start` compiles dynamic pages (login, search, …) on the
          # FIRST request — a cold compile makes hydration miss the spec's
          # first click/submit (the pre-hydration interaction flake that
          # took down admin-nav, public-header, booking specs). Warming
          # moves the compile cost out of the test window.
          for route in / /login /search /services /bundles /vendor-portal /store /admin/login; do
            curl -sf -o /dev/null "http://localhost:3000$route" || true
          done
          echo "warm-up done"
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'
          # Strong, non-blacklisted secrets — next start runs in production mode
          # and the API's env validator rejects the old weak test defaults.
          JWT_ACCESS_SECRET: 'e2e-access-9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c'
          JWT_REFRESH_SECRET: 'e2e-refresh-1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d'
          # B5 — test-only bcrypt cost: logins stay fast under parallel load
          # (cost 12 ≈ 36s under contention; the seeded cost-12 hashes still
          # verify correctly, the compare cost is encoded in the hash).
          BCRYPT_COST: '4'

      - name: Run Playwright Tests
        run: pnpm --filter @galaxy/web exec playwright test
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'
          JWT_ACCESS_SECRET: 'e2e-access-9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c'
          JWT_REFRESH_SECRET: 'e2e-refresh-1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d'
          PLAYWRIGHT_BASE_URL: 'http://localhost:3000'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  # ── Mobile Parity Smoke (E3) ─────────────────────────────
  # Runs the Expo web export of the MOBILE app at a phone viewport against
  # the API — the parity smoke for the critical mobile flows (the Detox
  # iOS-simulator suite stays macOS-local; ubuntu runners get web-parity).
  mobile-smoke:
    name: Mobile Smoke (E3)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gob_admin
          POSTGRES_PASSWORD: gob_test_pass
          POSTGRES_DB: Galaxy_of_Beauty_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Start Turbo remote cache
        uses: rharkor/caching-for-turbo@v2.5.2

      - name: Generate Prisma Client
        run: pnpm --filter @galaxy/db exec prisma generate
      - name: Migrate Schema (CI)
        run: pnpm --filter @galaxy/db exec prisma migrate deploy
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'
      - name: Seed Test Data
        run: pnpm --filter @galaxy/db db:seed
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'

      - name: Build Web App (API host)
        run: pnpm turbo run build --filter=@galaxy/web
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'
          JWT_ACCESS_SECRET: 'e2e-access-9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c'
          JWT_REFRESH_SECRET: 'e2e-refresh-1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d'

      - name: Start API (Next)
        run: |
          pnpm --filter @galaxy/web exec next start --port 3000 &
          SERVER_PID=$!
          for i in $(seq 1 120); do
            if curl -sf http://localhost:3000/api/trpc/health >/dev/null 2>&1; then break; fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then echo "Server exited early"; exit 1; fi
            sleep 1
          done
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'
          JWT_ACCESS_SECRET: 'e2e-access-9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c'
          JWT_REFRESH_SECRET: 'e2e-refresh-1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d'
          BCRYPT_COST: '4'

      - name: Export Mobile Web Build
        run: pnpm --filter @galaxy/mobile exec expo export --platform web
      - name: Serve Mobile Export
        run: |
          npx serve -s apps/mobile/dist -l 8081 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081 >/dev/null 2>&1; then break; fi
            sleep 1
          done
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Browser
        run: pnpm --filter @galaxy/mobile exec playwright install --with-deps chromium

      - name: Run Mobile Parity Specs
        run: pnpm --filter @galaxy/mobile exec playwright test --config playwright.config.ts
        env:
          PLAYWRIGHT_BASE_URL: 'http://localhost:8081'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-smoke-report
          path: apps/mobile/test-results/
          retention-days: 7
          retention-days: 7

  # ── k6 Load Gate (B3) ─────────────────────────────────────
  # PR-level load gate: boots the built app against real postgres/redis
  # and walks health → catalog browse. CI-grade budgets (p95<2000ms) —
  # the teeth are the failure rate and endpoint shape checks; the weekly
  # prod smoke/load jobs keep the strict budgets (p95<750ms).
  k6-gate:
    name: k6 Load Gate
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gob_admin
          POSTGRES_PASSWORD: gob_test_pass
          POSTGRES_DB: Galaxy_of_Beauty_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Start Turbo remote cache
        uses: rharkor/caching-for-turbo@v2.5.2

      - name: Generate Prisma Client
        run: pnpm --filter @galaxy/db exec prisma generate
      - name: Migrate Schema (CI)
        run: pnpm --filter @galaxy/db exec prisma migrate deploy
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'
      - name: Seed Test Data
        run: pnpm --filter @galaxy/db db:seed
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'
      - name: Build Web App
        run: pnpm turbo run build --filter=@galaxy/web
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'
          JWT_ACCESS_SECRET: 'e2e-access-9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c'
          JWT_REFRESH_SECRET: 'e2e-refresh-1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d'
      - name: Start Next.js Server
        run: |
          pnpm --filter @galaxy/web exec next start --port 3000 &
          SERVER_PID=$!
          READY=0
          for i in $(seq 1 180); do
            if curl -sf http://localhost:3000/api/trpc/health >/dev/null 2>&1; then READY=1; break; fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then echo "Server exited early"; exit 1; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "Server never became healthy — aborting before k6"
            exit 1
          fi
        env:
          DATABASE_URL: 'postgresql://gob_admin:gob_test_pass@localhost:5432/Galaxy_of_Beauty_db?schema=public'
          JWT_ACCESS_SECRET: 'e2e-access-9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c'
          JWT_REFRESH_SECRET: 'e2e-refresh-1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d'
      - name: Install k6 (runner network — the action's container can't reach localhost)
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz | tar xz
          sudo mv k6-v2.3.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - name: Run k6 Gate
        run: k6 run scripts/load/ci-gate.js --env TARGET_URL=http://localhost:3000

  # ── Docker Build ──────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
