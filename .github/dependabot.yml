version: 2
updates:
  # Monorepo dependencies (pnpm workspace)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 10
    versioning-strategy: auto
    labels:
      - dependencies
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Riyadh
    labels:
      - dependencies
      - ci
