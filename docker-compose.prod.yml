# ═══════════════════════════════════════════
# Galaxy of Beauty — Production Override
# ═══════════════════════════════════════════
# Extends docker-compose.yml with production settings.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '0.5'
    environment:
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      POSTGRES_MAINTENANCE_WORK_MEM: 128MB
      POSTGRES_WAL_BUFFERS: 16MB
      POSTGRES_MAX_CONNECTIONS: 100
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/backup-db.sh:/backup.sh:ro

  redis:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes --save 900 1 --save 300 10

  web:
    build:
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN}
    environment:
      NODE_ENV: production
      SENTRY_DSN: ${SENTRY_DSN}
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '1'
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/trpc/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  socket:
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: always

  # ── Daily DB backup sidecar (AUDIT_2026-10-30 item 2) ────────────────
  # Runs backup-container.sh (pg_dump over the compose network, gzip,
  # 14-day rotation) on a crond schedule. Default 03:00 UTC — override
  # with BACKUP_CRON. Verify by reading /backups/backup.log on the host
  # volume after the first scheduled run.
  backup:
    image: postgres:15-alpine
    restart: always
    depends_on:
      - postgres
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:-gob_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for the backup sidecar}
      PGDATABASE: ${POSTGRES_DB:-Galaxy_of_Beauty_db}
      RETENTION_DAYS: '14'
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
    volumes:
      - ./scripts/backup-container.sh:/backup.sh:ro
      - backups_data:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "${BACKUP_CRON} /backup.sh >> /backups/backup.log 2>&1" | crontab -
        echo "backup sidecar scheduled: ${BACKUP_CRON}"
        exec crond -f
  # ── TLS termination + reverse proxy (AUDIT item 9) ─────────────
  # deploy/nginx-compose.conf mounts read-only; certs live on the host at
  # ./deploy/ssl/{fullchain,privkey}.pem (certbot or a managed LB).
  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    networks:
      - gob-network

  # ── Monitoring stack (AUDIT item 10) — `monitoring` profile ───────
  # `docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile monitoring up -d`
  prometheus:
    profiles: ['monitoring']
    image: prom/prometheus:v2.53.0
    restart: always
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - '9090:9090'
    networks:
      - gob-network

  alertmanager:
    profiles: ['monitoring']
    image: prom/alertmanager:v0.27.0
    restart: always
    ports:
      - '9093:9093'
    networks:
      - gob-network

  grafana:
    profiles: ['monitoring']
    image: grafana/grafana:11.0.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required for the monitoring profile}
    ports:
      - '3001:3000'
    networks:
      - gob-network


  mobile:
    profiles: ["full"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

volumes:
  postgres_data:
    driver: local
  backups_data:
    driver: local

networks:
  gob-network:
    driver: bridge
