# ═══════════════════════════════════════════
# Prometheus — Galaxy of Beauty
# ═══════════════════════════════════════════
# Scrapes the app's /api/metrics endpoint (prom-client, gob_* prefix)
# plus postgres/redis/node exporters from the monitoring profile.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'gob-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['web:3000']
        labels:
          service: 'galaxy-api'
          environment: 'production'

  - job_name: 'gob-postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'

  - job_name: 'gob-redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'system'
