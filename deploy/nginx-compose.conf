# Galaxy of Beauty — Nginx Reverse Proxy (Compose mode)
# Compose-aware variant of deploy/nginx.conf: the upstreams are the
# `web` and `socket` services on gob-network, not 127.0.0.1. TLS
# terminates here; certs mount from the host (certbot or a managed LB
# can both feed this). Static assets are served by the web container
# itself (Next sets immutable cache headers) — nginx only proxies here.
upstream nextjs_upstream { server web:3000; keepalive 64; }
upstream socket_upstream { server socket:4001; }

server {
    listen 80;
    server_name galaxyofbeauty.sa www.galaxyofbeauty.sa;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name galaxyofbeauty.sa www.galaxyofbeauty.sa;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Cap request bodies at the edge (uploads go to S3 via presigned
    # URLs; the only large in-band payloads are base64-encoded and the
    # app-side cap is enforced in uploads.ts).
    client_max_body_size 35m;

    # Real-time events (WebSocket) — must be proxied to the socket
    # service, not to Next.js.
    location /socket.io/ {
        proxy_pass http://socket_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
