# ═══════════════════════════════════════════
# Alerting Rules — Galaxy of Beauty
# ═══════════════════════════════════════════
# Every expression below is written against metrics that actually exist:
# the app exposes gob_http_requests_total / gob_http_errors_total /
# gob_gateway_breaker_state{breaker} / gob_queue_depth{queue} at
# /api/metrics (packages/api/src/lib/metrics.ts), plus the default
# gob_process_* metrics. DB/Redis/system metrics come from the exporters
# in the monitoring profile.

groups:
  - name: galaxy_alerts
    rules:
      # ── Availability ──
      - alert: ServiceDown
        expr: up{job="gob-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API is DOWN"
          description: "{{ $labels.service }} has been down for 2 minutes"

      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is DOWN"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN"

      # ── Performance ──
      - alert: HighErrorRate
        expr: rate(gob_http_errors_total[5m]) / rate(gob_http_requests_total[5m]) > 0.05 and rate(gob_http_requests_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "tRPC error rate > 5%"
          description: "{{ $value | humanizePercentage }} error rate in last 5 minutes"

      # ── Circuit breakers (gob_gateway_breaker_state: 0=closed, 1=halfOpen, 2=open) ──
      - alert: GatewayBreakerOpen
        expr: gob_gateway_breaker_state == 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker OPEN on {{ $labels.breaker }}"
          description: "The {{ $labels.breaker }} gateway has failed closed for 2 minutes — payments/SMS/AI calls are being rejected."

      # ── Queues ──
      - alert: QueueBacklog
        expr: gob_queue_depth > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Queue {{ $labels.queue }} backed up ({{ $value }} waiting)"
          description: "Waiting jobs on {{ $labels.queue }} exceed 100 for 10 minutes — check the worker."

      # ── Capacity ──
      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB connections > 80 (max 100)"

      - alert: HighRedisMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory > 85%"

      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space < 20%"
