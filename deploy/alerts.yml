# ═══════════════════════════════════════════
# Alerting Rules — Galaxy of Beauty
# ═══════════════════════════════════════════

groups:
  - name: galaxy_alerts
    rules:
      # ── Availability ──
      - alert: ServiceDown
        expr: up{job="gob-api"} == 0
        for: 2m
        labels:
          severity: critical
          channel: pagerduty
        annotations:
          summary: "API is DOWN"
          description: "{{ $labels.service }} has been down for 2 minutes"

      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          channel: pagerduty
        annotations:
          summary: "PostgreSQL is DOWN"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          channel: pagerduty
        annotations:
          summary: "Redis is DOWN"

      # ── Performance ──
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          channel: slack
        annotations:
          summary: "Error rate > 5%"
          description: "{{ $value | humanizePercentage }} error rate in last 5 minutes"

      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 10m
        labels:
          severity: warning
          channel: slack
        annotations:
          summary: "p95 response time > 2s"

      - alert: PaymentFailureSpike
        expr: rate(payment_failures_total[10m]) / rate(payment_attempts_total[10m]) > 0.10
        for: 10m
        labels:
          severity: critical
          channel: pagerduty
        annotations:
          summary: "Payment failure rate > 10%"

      # ── Capacity ──
      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          channel: slack
        annotations:
          summary: "DB connections > 80 (max 100)"

      - alert: HighRedisMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 10m
        labels:
          severity: warning
          channel: slack
        annotations:
          summary: "Redis memory > 85%"

      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.20
        for: 5m
        labels:
          severity: critical
          channel: pagerduty
        annotations:
          summary: "Disk space < 20%"

      # ── Business ──
      - alert: NoBookingsIn2Hours
        expr: rate(bookings_created_total[2h]) == 0
        for: 2h
        labels:
          severity: info
          channel: slack
        annotations:
          summary: "No bookings in 2 hours — possible outage"
